openapi: 3.1.0
info:
  title: DiamantesExpress Agent API (contrato PROVISIONAL)
  version: 0.1.0-provisional
  description: |
    Contrato provisional entre DiamantesExpress Agent (Windows) y el backend de Hostinger Horizons.
    NO describe rutas existentes: es la propuesta que Horizons debe implementar o reemplazar.
    El agente resuelve cada operación por su `operationId`; si Horizons publica otras rutas,
    basta con importar su OpenAPI conservando los operationId o configurar `route_overrides`.
    Todas las rutas son relativas a DIAMANTESEXPRESS_API_URL (por ejemplo https://tienda.example/api/agent/v1).
    Autenticación: `Authorization: Bearer <token del agente>`, salvo `pairAgent`.
    Las operaciones de escritura aceptan la cabecera `Idempotency-Key`; el backend debe
    devolver la misma respuesta ante una clave repetida sin duplicar efectos.
servers:
  - url: https://REEMPLAZAR-POR-HORIZONS/api/agent/v1
security:
  - agentToken: []
paths:
  /agents/pair:
    post:
      operationId: pairAgent
      security: []
      summary: Emparejar un agente con un código de un solo uso generado en el panel de superadministrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_code, machine_name, agent_version]
              properties:
                pairing_code: {type: string}
                machine_name: {type: string}
                agent_version: {type: string}
      responses:
        "200":
          description: Credenciales del agente
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, agent_token]
                properties:
                  agent_id: {type: string}
                  agent_token: {type: string}
                  token_expires_at: {type: string, format: date-time}
        "401": {description: Código inválido o expirado}
  /agents/{agent_id}/heartbeat:
    post:
      operationId: sendHeartbeat
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Heartbeat"}
      responses:
        "200":
          description: Recibido. Puede incluir órdenes de control seguras (solo pause/resume).
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: {type: string, format: date-time}
                  requested_state: {type: string, enum: [running, paused]}
        "401": {description: Token inválido, expirado o revocado}
  /agents/{agent_id}/config:
    get:
      operationId: getAgentConfig
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Configuración remota del agente
          content:
            application/json:
              schema:
                type: object
                properties:
                  production_authorized: {type: boolean, default: false}
                  authorization_reference: {type: string}
                  max_ai_cost_per_order_usd: {type: number}
                  daily_ai_budget_usd: {type: number}
  /agents/{agent_id}/jobs:
    get:
      operationId: listPendingJobs
      parameters:
        - {$ref: "#/components/parameters/AgentId"}
        - {name: limit, in: query, schema: {type: integer, default: 5}}
      responses:
        "200":
          description: Trabajos pendientes asignables a este agente
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: {$ref: "#/components/schemas/Job"}
  /jobs/{job_id}:
    get:
      operationId: getJob
      parameters: [{$ref: "#/components/parameters/JobId"}]
      responses:
        "200":
          description: Estado actual del trabajo (el agente lo consulta antes del paso transaccional)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobState"}
  /jobs/{job_id}/claim:
    post:
      operationId: claimJob
      summary: Reclamación ATÓMICA. Solo un agente puede reclamar un trabajo.
      parameters: [{$ref: "#/components/parameters/JobId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: {type: string}
                instance: {type: string}
      responses:
        "200":
          description: Reclamado por este agente (repetir la misma Idempotency-Key devuelve 200 de nuevo)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "409": {description: Ya reclamado por otro agente o no disponible}
  /jobs/{job_id}/progress:
    post:
      operationId: reportProgress
      parameters: [{$ref: "#/components/parameters/JobId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string}
                step: {type: string}
                message: {type: string}
                at: {type: string, format: date-time}
      responses:
        "200": {description: OK}
  /usage:
    post:
      operationId: reportUsage
      summary: Consumo OpenAI. Idempotente por record_id.
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                records:
                  type: array
                  items: {$ref: "#/components/schemas/UsageRecord"}
      responses:
        "200":
          description: Registros aceptados (los repetidos se ignoran)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: {type: integer}
                  duplicates: {type: integer}
  /jobs/{job_id}/evidence:
    post:
      operationId: uploadEvidence
      parameters: [{$ref: "#/components/parameters/JobId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                metadata: {type: string, description: JSON con evidence_id, kind, sha256, label}
                file: {type: string, format: binary}
      responses:
        "200": {description: OK}
  /jobs/{job_id}/complete:
    post:
      operationId: completeJob
      summary: Resultado final verificado (completed, failed o needs_review).
      parameters: [{$ref: "#/components/parameters/JobId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JobOutcome"}
      responses:
        "200": {description: OK}
        "409": {description: El trabajo ya no pertenece a este agente}
  /jobs/{job_id}/release:
    post:
      operationId: releaseJob
      summary: Devolver un trabajo sin haber ejecutado el paso transaccional.
      parameters: [{$ref: "#/components/parameters/JobId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200": {description: OK}
  /agents/{agent_id}/alerts:
    post:
      operationId: reportAlert
      parameters: [{$ref: "#/components/parameters/AgentId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: {type: string, enum: [info, warning, critical]}
                code: {type: string}
                message: {type: string}
                at: {type: string, format: date-time}
      responses:
        "200": {description: OK}
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
  parameters:
    AgentId: {name: agent_id, in: path, required: true, schema: {type: string}}
    JobId: {name: job_id, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string}}
  schemas:
    Job:
      type: object
      required: [job_id, order_id, recipient, product]
      properties:
        job_id: {type: string}
        order_id: {type: string}
        type: {type: string, example: gift_delivery}
        workflow_id: {type: string}
        attempt: {type: integer}
        lease_expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        recipient:
          type: object
          required: [player_id]
          properties:
            player_id: {type: string}
            nickname: {type: string}
            region: {type: string}
        product:
          type: object
          required: [code, name]
          properties:
            code: {type: string}
            name: {type: string}
            quantity: {type: integer, default: 1}
    JobState:
      type: object
      properties:
        job_id: {type: string}
        status: {type: string, enum: [pending, claimed, completed, failed, needs_review, cancelled]}
        claimed_by: {type: string}
    Heartbeat:
      type: object
      properties:
        agent_version: {type: string}
        state: {type: string}
        mode: {type: string}
        current_job_id: {type: string}
        emulator: {type: object}
        usage_today: {type: object}
        outbox_pending: {type: integer}
        sent_at: {type: string, format: date-time}
    UsageRecord:
      type: object
      required: [record_id, agent_id, model, created_at]
      properties:
        record_id: {type: string}
        job_id: {type: string}
        order_id: {type: string}
        agent_id: {type: string}
        model: {type: string}
        request_id: {type: string}
        response_id: {type: string}
        created_at: {type: string, format: date-time}
        input_tokens: {type: integer}
        cached_input_tokens: {type: integer}
        output_tokens: {type: integer}
        reasoning_tokens: {type: integer}
        total_tokens: {type: integer}
        latency_ms: {type: integer}
        cost_usd: {type: number}
        status: {type: string}
    JobOutcome:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [completed, failed, needs_review]}
        error_code: {type: string}
        message: {type: string}
        pre_commit: {type: boolean}
        verification: {type: object}
        approved_by: {type: string}
        actions: {type: integer}
        ai_requests: {type: integer}
        tokens_total: {type: integer}
        cost_usd: {type: number}
        duration_s: {type: number}
