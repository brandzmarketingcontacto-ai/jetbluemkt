[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diamantesexpress-agent"
version = "0.1.0"
description = "DiamantesExpress Agent: agente nativo de Windows para procesar pedidos con BlueStacks, ADB y OpenAI."
requires-python = ">=3.12"
authors = [{name = "brandzmkt.lat"}]
dependencies = [
  "PySide6>=6.7",
  "httpx>=0.27",
  "openai>=1.60",
  "pydantic>=2.7",
  "keyring>=25",
  "psutil>=5.9",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6.5"]

[project.scripts]
dxagent = "dxagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dxagent = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
